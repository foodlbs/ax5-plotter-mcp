version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ax5-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ax5-api
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./logs:/app/logs
      # Mount for serial device access
      - /dev:/dev
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # Adjust for your Arduino port
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    privileged: true  # Required for serial port access
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ax5-worker
    volumes:
      - ./config:/app/config
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./logs:/app/logs
      - /dev:/dev
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    privileged: true
    restart: unless-stopped
    command: python src/workers/plot_worker.py

volumes:
  redis_data:
    driver: local

# Note: Docker requires privileged mode for serial port access
# For production on ZimaBoard, it's recommended to run natively without Docker
# to avoid complexity with USB device passthrough and permissions
