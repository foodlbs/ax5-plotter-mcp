# AX5 Plotter Photo Booth Configuration

# AI Models Configuration
ai:
  # AI provider models (specify which models to use)
  models:
    anthropic: "claude-3-5-sonnet-20241022"  # Claude model for caricature generation
    openai: "gpt-4o"                         # OpenAI model (alternative)
    gemini: "gemini-2.5-flash"              # Google Gemini model (alternative)
  
  # Optional: Store API keys here (or configure via UI)
  # Leave blank to configure through the app interface
  api_keys:
    anthropic: ""  # Get from https://console.anthropic.com/
    openai: ""     # Get from https://platform.openai.com/
    gemini: ""     # Get from https://aistudio.google.com/

# Plotter Configuration
plotter:
  # Serial connection settings
  port: /dev/cu.usbserial-0001  # macOS/Linux. Windows: COM3, COM4, etc.
  baud: 115200
  timeout: 5  # seconds
  
  # Plotter dimensions (A5 size)
  width: 210   # mm
  height: 150  # mm
  margin: 10   # mm

# Servo/Pen Control
servo:
  pen_up_command: "M5"           # G-code for pen up
  pen_down_command: "M3 S90"     # G-code for pen down
  dwell_time: 0.15               # Seconds to wait after pen movement
  
  # Pen profiles for different pen types
  profiles:
    marker:
      dwell: 0.1
      speed: 800
    ballpoint:
      dwell: 0.15
      speed: 500
    fountain:
      dwell: 0.2
      speed: 300

# Drawing Speeds
speeds:
  travel: 3000      # Pen up movement speed (mm/min)
  draw: 500         # Default drawing speed (mm/min)
  homing: 2000      # Homing cycle speed (mm/min)

# Path Optimization
optimization:
  merge_tolerance: 0.1        # mm - connect paths closer than this
  simplify_tolerance: 0.05    # mm - reduce points for smoother lines
  use_line_sort: true         # Sort paths to minimize travel distance
  use_tsp: true               # Use traveling salesman optimization
  reloop: true                # Randomize seam positions

# Queue Settings
queue:
  retry_max: 3                # Maximum retry attempts for failed jobs
  save_file: "queue_state.json"  # File to persist queue state

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: logs/photo_booth.log
